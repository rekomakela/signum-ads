schema_version: signum_ontology_class_decisions.v1
status: master_foundation
project: Signum
last_updated: '2026-08-29'
purpose: Record how imported and legacy ontology concepts map into Signum Corpus Model
  v0.1. The mapping is no longer constrained to 20 classes or to current decoder object
  shapes.
decision_legend:
  keep: Imported class kept as a canonical class, same name.
  promote: A subtype or contract-implied concept raised to a canonical class.
  rename: Legacy class maps onto a canonical class under a new name.
  merge: Legacy/imported class folded into an existing canonical class.
  split: One class maps onto more than one canonical class or class+field.
  field: Represented as a field on a canonical class, not as its own class.
  defer: Not canonical now; reference-only, revisit later.
  legacy_only: Kept for migration/search compatibility; no canonical class.
  relationship: Represented as a relationship in core-relationships.v1.yaml, not a
    node.
