id: commodity_fetishism
concept_name: Commodity Fetishism
slug: commodity-fetishism
domain: semiotics
difficulty: advanced
tier: 1
entry_status: full
ontology_ref:
  class: Ideology
  subtype: CommodityFetishism
short_definition: The product appears to possess value, power, or personality by itself,
  while the social relations that produced that value disappear.
plain_language: A watch seems prestigious. A car seems powerful. A perfume seems seductive.
  But prestige, power, and seduction are social meanings, not physical substances
  inside objects. Advertising makes the object look like the source of the meaning.
why_it_matters: It helps the learner see how consumer culture shifts attention from
  people, labor, and social systems onto products.
how_to_spot:
- Look for products shown as autonomous protagonists.
- Ask what social relation is being converted into object-value.
- Notice people admiring the product rather than using it.
common_clues:
- spotlights
- altar-like product staging
- monumental scale
- glowing object
- language giving agency to products
local_examples:
- ad_id: generic_luxury_watch
  explanation: A watch shown alone against black space appears to contain prestige
    as if prestige were a material property.
