id: simplicity_framing
concept_name: Simplicity Framing
slug: simplicity-framing
domain: marketing
difficulty: intermediate
tier: 4
entry_status: condensed
ontology_ref:
  class: PersuasionTechnique
short_definition: Presenting a complex need or problem as if it has one clear, immediate,
  purchasable solution.
plain_language: The ad can make a complicated issue look easy to solve by reducing
  it to a single product gesture.
why_it_matters: Naming simplicity framing helps the learner check what complexity
  the ad leaves out to make the product feel sufficient.
how_to_spot:
- Look for a single product gesture that appears to resolve a wider life problem.
- Ask what steps, costs, or trade-offs are hidden by the simple framing.
- Notice minimal layouts and just or simply language.
common_clues:
- just
