id: visual_metaphor
concept_name: Visual Metaphor
slug: visual-metaphor
domain: semiotics
difficulty: intermediate
tier: 2
entry_status: full
ontology_ref:
  class: Signifier
short_definition: A visual arrangement where one image element helps carry the meaning
  of another.
plain_language: An ad uses visual metaphor when one thing stands in for another through
  resemblance, substitution, or a deliberate visual pairing. The image asks you to
  read beyond the literal scene.
why_it_matters: It shows how ads compress big ideas into one image so the learner
  can explain the meaning instead of treating the picture as decoration.
how_to_spot:
- Ask what one element is standing in for.
- Look for substitution, analogy, or a scene that would be odd if read literally.
- Test whether the image depends on comparison rather than direct statement.
common_clues:
- stand-in meaning
- visual analogy
- visual comparison
- surprising pairing
- image doing the work of copy
local_examples:
- ad_id: insurance-family-future
  explanation: The calm family scene can stand in for security and long-term protection,
    letting one image carry the promise.
related_concepts:
- signifier
- signified
- referent_system
- interpretation
