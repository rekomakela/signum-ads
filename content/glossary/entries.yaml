id: signified
concept_name: Signified
slug: signified
domain: semiotics
difficulty: beginner
tier: 1
entry_status: full
ontology_ref:
  class: Signified
short_definition: The idea, feeling, value, or social meaning evoked by a signifier
  in the viewer’s mind.
plain_language: 'The signifier is what appears in the ad. The signified is what it
  calls up: elegance, purity, power, belonging, youth, expertise, desire. Signifieds
  are not simply inside the image; they depend on cultural learning and viewer context.'
why_it_matters: This concept shows that ad meaning is constructed, not natural. It
  lets the learner ask why a face, color, or product has come to mean what it means.
how_to_spot:
- After naming a signifier, ask what idea or feeling it evokes.
- Ask whether a different viewer would make the same association.
- Look for abstract nouns or social values activated by the visible element.
common_clues:
- elegance
- freedom
- purity
- status
- confidence
- nostalgia
- security
local_examples:
- ad_id: chanel_no5_1974
  explanation: Deneuve’s face may evoke timeless beauty, French sophistication, cinematic
    glamour, and cool elegance.
related_concepts:
