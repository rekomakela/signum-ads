id: contrast
concept_name: Contrast
slug: contrast
domain: semiotics
difficulty: beginner
tier: 2
entry_status: full
ontology_ref:
  class: Signifier
  subtype: CompositionSignifier
short_definition: A deliberate difference in color, scale, tone, or placement that
  makes meaning stand out.
plain_language: Contrast creates meaning by putting differences next to each other.
  Light and dark, big and small, plain and ornate, or calm and busy can steer attention
  and make one element feel more important.
why_it_matters: It helps the learner see that layout and opposition are not just decoration;
  they shape hierarchy, mood, and emphasis.
how_to_spot:
- Ask what is being set against what.
- Notice oppositions in color, scale, texture, tone, or density.
- Look for places where difference creates emphasis or tension.
common_clues:
- light and dark
- big and small
- plain and ornate
- calm and busy
- opposition
local_examples:
- ad_id: watch-ad-midcentury
  explanation: The contrast between a dark surrounding field and a bright watch face
    pushes precision and prestige to the front.
related_concepts:
- signifier
- composition_signifier
- spatial_hierarchy
- visual_style
