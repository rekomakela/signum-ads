id: direct_gaze
concept_name: Direct Gaze
slug: direct-gaze
domain: media_literacy
difficulty: beginner
tier: 1
entry_status: full
ontology_ref:
  class: Signifier
  subtype: CompositionSignifier
short_definition: A depicted person looks directly at the camera and therefore at
  the viewer.
plain_language: Direct gaze creates a relationship. The viewer feels seen, addressed,
  invited, challenged, or recognized. It is a compositional choice, not a neutral
  accident.
why_it_matters: Direct gaze is one of the strongest mechanisms for viewer address
  and mirror identification.
how_to_spot:
- Check whether the subject’s eyes meet the camera.
- Ask how the gaze positions the viewer.
- Compare with ads where the subject looks away or at the product.
common_clues:
- both eyes visible
- eye-level framing
- knowing smile
- second-person copy nearby
local_examples:
- ad_id: chanel_no5_1974
  explanation: Deneuve’s gaze addresses the viewer and makes the ad feel intimate
    rather than merely descriptive.
