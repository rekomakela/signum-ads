id: magic_naturalization
concept_name: Magic Naturalization
slug: magic-naturalization
domain: semiotics
difficulty: intermediate
tier: 1
entry_status: full
ontology_ref:
  class: Ideology
  subtype: MagicNaturalization
short_definition: The erasure of labor, production, and process so the product appears
  natural or magically complete.
plain_language: Many ads hide the factory, workers, supply chain, testing, extraction,
  and waste. The product appears pristine, glowing, or naturally given. The magic
  is the removal of production from view.
why_it_matters: 'It teaches the learner to ask what the ad hides: labor, process,
  cost, environmental impact, and commercial construction.'
how_to_spot:
- Look for a finished product with no visible making process.
- Notice nature imagery around manufactured goods.
- Ask what production stages are absent.
common_clues:
- glow or halo
- flowers/water/sunlight
- no workers or tools
- pristine surfaces
- words like pure, essential, natural
local_examples:
- ad_id: chanel_no5_1974
  explanation: The perfume bottle appears as an effortless extension of elegance;
    no flowers, chemists, factories, or retail labor are shown.
related_concepts:
- cooking_nature
- commodity_fetishism
- nature_referent_system
- product_as_magic_object
