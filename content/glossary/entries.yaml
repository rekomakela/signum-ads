id: try_first_method
concept_name: Try-First Method
slug: the-try-first-method
domain: media_literacy
difficulty: beginner
tier: 1
entry_status: full
ontology_ref:
  class: TryFirstResponse
short_definition: A learning method where the learner records observations before
  seeing expert analysis.
plain_language: Instead of reading the answer first, the learner looks, writes, and
  only then compares with curated analysis. The purpose is practice, not guessing
  the official reading.
why_it_matters: It builds independent decoding skill and keeps the user active inside
  the workbench.
how_to_spot:
- Write at least three observations before reveal.
- Use neutral evidence-based wording first.
- Compare what you noticed with the expert layer.
common_clues:
- notebook surface
- hidden expert analysis
- reveal step
- reflection prompt
local_examples:
- ad_id: any
  explanation: Every Signum decode flow should invite the learner to try first before
    the analysis opens.
