id: gendered_essentialism
concept_name: Gendered Essentialism
slug: gendered-essentialism
domain: sociology
difficulty: intermediate
tier: 1
entry_status: full
ontology_ref:
  class: Ideology
  subtype: GenderedEssentialism
short_definition: Gender is presented as natural, binary, and tied to fixed products,
  behaviors, bodies, and desires.
plain_language: 'Advertising often teaches what men and women supposedly are. It repeats
  visual scripts: men as active, rational, rugged, controlling; women as beautiful,
  nurturing, receptive, displayed. These scripts are cultural, but ads make them feel
  natural.'
why_it_matters: It lets the learner question gender roles that ads present as common
  sense.
how_to_spot:
- Look for unnecessary gender coding.
- Compare body language, gaze, space, and agency.
- Ask what gender possibilities are excluded.
common_clues:
- pink/blue coding
- men active / women displayed
- heteronormative pairing
- gendered product versions
- soft vs rugged language
local_examples:
- ad_id: generic_household_cleaner_1950s
  explanation: A smiling woman cleaning a kitchen frames domestic labor as natural
    feminine fulfillment.
