id: mirror_identification
concept_name: Mirror Identification
slug: mirror-identification
domain: semiotics
difficulty: intermediate
tier: 1
entry_status: full
ontology_ref:
  class: Ideology
  subtype: MirrorIdentification
short_definition: A structure where the viewer is invited to recognize themselves
  in the depicted person or desired identity.
plain_language: 'The ad acts like a mirror. A person looks out, or the copy says “you,”
  and the viewer is offered an identity: this is you, or this could be you. The product
  completes the recognition.'
why_it_matters: It explains why mass advertising can feel personally addressed.
how_to_spot:
- Look for direct eye contact.
- Look for second-person address.
- Ask what identity the viewer is invited to occupy.
common_clues:
- direct gaze
- eye-level framing
- aspirational but attainable figure
- welcoming or knowing expression
- you/yours copy
local_examples:
- ad_id: chanel_no5_1974
  explanation: Deneuve looks at the viewer rather than at the bottle, inviting recognition
    with the image’s composed elegance.
related_concepts:
- direct_gaze
