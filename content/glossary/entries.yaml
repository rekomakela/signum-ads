id: cooking_nature
concept_name: Cooking Nature
slug: cooking-nature
domain: semiotics
difficulty: intermediate
tier: 1
entry_status: full
ontology_ref:
  class: Ideology
  subtype: CookingNature
short_definition: A raw natural material and a finished product are connected while
  the industrial transformation between them is hidden.
plain_language: The ad shows the raw and the finished, but not the kitchen. Flowers
  become perfume, aloe becomes moisturizer, beans become lifestyle coffee. The transformation
  appears gentle and inevitable, not industrial.
why_it_matters: It exposes how “natural” product narratives can erase processing,
  chemistry, labor, logistics, and commercial design.
how_to_spot:
- Look for raw ingredients beside finished goods.
- Ask what transformation step is missing.
- Notice language like infused, crafted, born from, natural.
common_clues:
- plants beside packaged products
- water/dew/steam
- no factory or lab
- farm-to-table shortcuts
- botanical language
local_examples:
- ad_id: generic_skincare_aloe
  explanation: An aloe leaf next to a jar of cream implies nature has become skincare
    without showing extraction, formulation, preservatives, packaging, or distribution.
