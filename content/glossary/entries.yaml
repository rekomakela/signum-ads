id: signifier
concept_name: Signifier
slug: signifier
domain: semiotics
difficulty: beginner
tier: 1
entry_status: full
ontology_ref:
  class: Signifier
short_definition: 'A concrete element in an advertisement that you can literally point
  to: a person, object, word, color, or arrangement.'
plain_language: The signifier is the visible or audible thing before interpretation
  begins. In a perfume ad, it may be a face, a bottle, a brand name, a color palette,
  or the position of the product in the frame. Signum starts here because careful
  looking comes before meaning-making.
why_it_matters: Separating signifiers from meanings gives the learner a pause button.
  It prevents the ad’s impression from replacing evidence.
how_to_spot:
- 'Ask: what do I literally see?'
- Use neutral labels before interpretive adjectives.
- Point to the exact element in the frame.
common_clues:
- people
- objects
- written words
- dominant colors
- layout and spatial hierarchy
- typefaces
local_examples:
- ad_id: chanel_no5_1974
  explanation: Catherine Deneuve’s face, direct gaze, blonde hair, the Chanel bottle,
    amber liquid, cream background, and brand name are signifiers before they become
    meanings.
related_concepts:
- signified
- referent_system
- observation
- person_signifier
- object_signifier
