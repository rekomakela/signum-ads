domain: sociology
difficulty: intermediate
tier: 4
entry_status: condensed
ontology_ref:
  class: CulturalCode
short_definition: A shared cultural shorthand that lets an image mean more than what
  is literally shown.
plain_language: A cultural code is the background knowledge an ad assumes you already
  have. It is how a white coat means expertise, or a gold watch means prestige, before
  the copy explains anything.
why_it_matters: It helps the learner name the shared associations that make the ad
  readable and persuasive.
how_to_spot:
- Ask what the image expects you to recognize immediately.
- Look for symbols that carry meaning because they already belong to a wider culture.
- Check whether the ad would lose force if the viewer did not know the code.
common_clues:
