id: confidence_interpretation
concept_name: Confidence (in Interpretation)
slug: confidence-in-interpretation
domain: media_literacy
difficulty: intermediate
tier: 1
entry_status: full
ontology_ref:
  class: Interpretation
short_definition: A label for how strongly an interpretation is supported by evidence.
plain_language: Some readings are well supported by visible evidence and theory. Others
  are plausible, speculative, or disputed. Signum should expose that difference rather
  than present every interpretation as equally certain.
why_it_matters: It teaches that analysis is judgment under evidence, not hidden truth
  extraction.
how_to_spot:
