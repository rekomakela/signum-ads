slug: observation
domain: media_literacy
difficulty: beginner
tier: 1
entry_status: full
ontology_ref:
  class: Observation
short_definition: A specific, evidence-based noticing statement about what is present
  in the ad.
plain_language: An observation says what is there, not what it means. “A bottle sits
  in the lower right” is an observation. “The bottle symbolizes desire” is interpretation.
why_it_matters: Good interpretations require evidence. Observation is the discipline
  that keeps analysis grounded.
how_to_spot:
