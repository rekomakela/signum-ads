id: semiotics
concept_name: Semiotics
slug: semiotics
domain: semiotics
difficulty: beginner
tier: 1
entry_status: full
ontology_ref:
  class: GlossaryEntry
short_definition: The study of signs and how they produce meaning.
plain_language: Semiotics asks not only what something means, but how it comes to
  mean. In Signum, semiotics is the method for moving from visible elements to cultural
  associations, ideologies, and alternative readings.
why_it_matters: It gives the learner a repeatable method for decoding ads instead
  of only reacting to them.
how_to_spot:
- Separate what is visible from what is interpreted.
- 'Trace the chain: signifier → signified → referent system → ideology.'
- Ask how a connection became natural.
common_clues:
- signifier/signified language
- cultural codes
- naturalized meanings
- mythic or ideological framing
local_examples:
- ad_id: chanel_no5_1974
  explanation: The learner can trace Deneuve’s face from visible person-signifier
    to French elegance to celebrity culture to gendered luxury ideology.
related_concepts:
- signifier
- signified
- referent_system
- ideology
- observation
