id: counter_reading
concept_name: Counter-Reading
slug: counter-reading
domain: media_literacy
difficulty: advanced
tier: 1
entry_status: full
ontology_ref:
  class: CounterReading
short_definition: An alternative interpretation that complicates, challenges, or qualifies
  the primary reading.
plain_language: 'Ads are polysemic: they can support more than one reading. A counter-reading
  uses evidence to show another angle, another viewer position, or a limit in the
  main interpretation.'
why_it_matters: It prevents media literacy from becoming dogma and models intellectual
  humility.
how_to_spot:
- 'Ask: from whose perspective?'
- Use the same evidence to test another conclusion.
- Look for what the primary reading leaves out.
common_clues:
- however / alternatively
- same signifier, different conclusion
- qualified confidence
