id: ideology
concept_name: Ideology
slug: ideology
domain: semiotics
difficulty: beginner
tier: 1
entry_status: full
ontology_ref:
  class: Ideology
short_definition: A hidden belief system an ad makes feel natural, obvious, or commonsensical.
plain_language: 'Ideology is not just what an ad says. It is what the ad assumes:
  what counts as normal, desirable, successful, feminine, masculine, modern, natural,
  or beautiful. Ads often do not argue for these beliefs; they stage them as reality.'
why_it_matters: Naming ideology lets the learner see how advertising teaches social
  beliefs while appearing to sell only products.
how_to_spot:
- Ask what the ad treats as obvious.
- Ask what belief must be accepted for the ad to feel natural.
- Ask who benefits if this belief feels like common sense.
common_clues:
- absence of alternatives
- social roles shown as natural
- products linked to happiness or identity
- beauty or success treated as personal obligation
local_examples:
- ad_id: chanel_no5_1974
  explanation: The ad can naturalize femininity as beauty, elegance as product-mediated,
    and luxury as effortless identity.
related_concepts:
- magic_naturalization
- mirror_identification
- gendered_essentialism
- success_through_consumption
