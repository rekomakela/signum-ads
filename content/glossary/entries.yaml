id: symbol
concept_name: Symbol
slug: symbol
domain: semiotics
difficulty: beginner
tier: 1
entry_status: full
ontology_ref:
  class: Signifier
  subtype: ObjectSignifier
short_definition: A signifier that carries a learned cultural meaning beyond its literal
  form.
plain_language: A symbol works because viewers already know the code around it. A
  watch, color, object, or mark can become shorthand for status, purity, authority,
  or belonging.
why_it_matters: It helps the learner explain how ads move quickly from image to idea
  using shared cultural knowledge.
how_to_spot:
- Ask what the object or mark means beyond itself.
- Look for culturally learned shorthand or repeated conventions.
- Check whether the same form would read differently in another setting.
common_clues:
- cultural shorthand
- badge
- emblem
- icon
- shared code
local_examples:
- ad_id: sample-soap-purity-ad
  explanation: A white, orderly domestic scene can symbolize purity and moral cleanliness
    because the code already feels familiar.
