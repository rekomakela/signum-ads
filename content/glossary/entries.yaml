id: dominant_culture
concept_name: Dominant Culture
slug: dominant-culture
domain: sociology
difficulty: intermediate
tier: 5
entry_status: condensed
ontology_ref:
  class: CulturalCode
short_definition: The culture that gets treated as normal, central, and unmarked within
  a society.
plain_language: Dominant culture is the version of life that does not have to explain
  itself. Ads often present it as simple common sense rather than one position among
  many.
why_it_matters: It helps the learner notice whose lifestyle gets to feel universal.
how_to_spot:
- Ask whose norms appear ordinary and whose are missing or marked as different.
- Look for “just normal life” scenes that quietly center one worldview.
- Notice when respectability is shown as the default.
common_clues:
- normal
- mainstream
- default
- respectable
