schema_version: signum_core_relationships.v1
corpus_model_version: '0.1'
status: master_corpus_foundation
project: Signum
last_updated: '2026-08-29'
purpose: Core factual, analytical, and derived relationships for Corpus Model v0.1.
  Edge epistemic type is explicit so archive fact, interpretation, and computed similarity
  cannot be confused.
epistemic_type_legend:
  asserted_factual: Corpus fact supported by provenance.
  analytical: Contestable analytical relation belonging to a DecodeRevision.
  derived: Regenerable relation computed from corpus structure.
